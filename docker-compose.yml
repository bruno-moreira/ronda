version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ronda_postgres
    restart: always
    environment:
      POSTGRES_USER: ronda
      POSTGRES_PASSWORD: rondapassword
      POSTGRES_DB: ronda_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
